# SDC.toml
#
# One line = one parameter to make.
#   valid_runs   = [A, B] : the parameter is used for runs A to B
#   filename_run = N      : run number used in the name of the output file
#   input_runs   = [X, Y] : runs X to Y are analyzed together
#   pedestal_run = P      : (only where needed) run used for pedestals;
#                           write the run of input_runs if the pedestal
#                           events are in that run
# A range [first, last] includes both first and last.
#
# Rules:
#   - Keep one entry on one line.
#   - Order the lines by valid_runs; valid_runs must not overlap.
#   - Runs that no valid_runs covers have no parameter in this map.

DCTDC = [
  { valid_runs = [5501, 6468], filename_run = 5501, input_runs = [5501, 5501] },
  { valid_runs = [6471, 6844], filename_run = 6471, input_runs = [6471, 6471] },
  { valid_runs = [6891, -1], filename_run = 7162, input_runs = [7162, 7162] },
]

DCDRFT = { same_as = "DCTDC" }
